<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
    <div class="checkbox">
        <h2>Payment Information</h2>
        <form>
            <label for="name">Enter your name</label>
            <input type="text" id="name" placeholder="Alex"/> 
            <label for="email">Enter your email</label>
            <input type="email" id="email" placeholder="Alex@gmail.com"/> 
            <label for="card-name">Enter your card name</label>
            <input type="text" id="card-name" placeholder="ALEX"/>
            <label for="card-expiry-date">Enter your card expiry date</label>
            <input type="text" id="card-expiry-date"  placeholder="MM/YY"/>
            <label for="card-number">Enter your card number</label>
            <input type="text" id="card-number" placeholder="XXXX XXXX XXXX"/>
            <label for="quantity">Quantity (KG)</label>
            <input type="range"  value="25" min="5" max="100"/>

             <button type="submit">Confirm order</button>
        </form>
    </div>   
    </section>



</body>
</html>
